name: Release Build

# Builds, signs and packages the DMG for a tag, attaches it to the matching
# GitHub Release, and asks maptic/homebrew-tap to bump its cask.
#
# Called by release-please.yml right after it cuts a release (a release created
# with the default GITHUB_TOKEN does not emit a `release: published` event), and
# runnable by hand for a tag that needs re-packaging.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, e.g. 1.2.3
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. 1.2.3
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    env:
      TAG: ${{ inputs.tag }}
      # 'true' only when Developer-ID signing secrets are configured.
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Tags are bare semver ("1.2.3"); the strip only guards a hand-typed "v".
      - name: Derive version
        id: ver
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build (Release, unsigned)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          xcodebuild \
            -project Mounty.xcodeproj \
            -scheme Mounty \
            -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO \
            clean build
          echo "APP=build/Build/Products/Release/Mounty.app" >> "$GITHUB_ENV"

      # -------- Signing --------
      # Notarized, Developer-ID signing runs ONLY if the signing secrets exist.
      # Otherwise we ad-hoc sign (app still runs after the one-time Gatekeeper bypass
      # documented in the README).
      - name: Ad-hoc sign
        if: env.HAS_SIGNING != 'true'
        run: codesign --force --deep --sign - "$APP"

      - name: Developer-ID sign + notarize
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          AC_APPLE_ID: ${{ secrets.AC_APPLE_ID }}
          AC_TEAM_ID: ${{ secrets.AC_TEAM_ID }}
          AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
        run: |
          # Import cert into a temporary keychain.
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PWD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PWD" \
            -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN"
          # Sign with hardened runtime.
          codesign --force --deep --options runtime --timestamp \
            --sign "$MACOS_SIGN_IDENTITY" "$APP"
          # Notarize the .app (zipped) then staple.
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/Mounty.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Mounty.zip" \
            --apple-id "$AC_APPLE_ID" --team-id "$AC_TEAM_ID" --password "$AC_PASSWORD" --wait
          xcrun stapler staple "$APP"

      # -------- Package --------
      - name: Create DMG
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          STAGE="$RUNNER_TEMP/dmg"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Mounty" -srcfolder "$STAGE" -ov -format UDZO \
            "Mounty-$VERSION.dmg"
          shasum -a 256 "Mounty-$VERSION.dmg" | tee "Mounty-$VERSION.dmg.sha256"

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          gh release upload "$TAG" \
            "Mounty-$VERSION.dmg" "Mounty-$VERSION.dmg.sha256" --clobber

  # -------- Homebrew cask --------
  # The tap owns the cask: it renders the download URL, re-computes the sha256
  # from the published asset and commits the bump itself. Requires
  # HOMEBREW_TAP_TOKEN — a fine-grained PAT with `contents: write` on
  # maptic/homebrew-tap. Without it the release still succeeds, only unbumped.
  update-tap:
    needs: build-dmg
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Dispatch cask-release to maptic/homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.build-dmg.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set; skipping the Homebrew cask bump."
            exit 0
          fi
          jq -n --arg version "$VERSION" \
            '{event_type: "cask-release", client_payload: {cask: "mounty", version: $version}}' \
            | gh api repos/maptic/homebrew-tap/dispatches --input -
          echo "::notice::Requested cask bump to $VERSION in maptic/homebrew-tap."
